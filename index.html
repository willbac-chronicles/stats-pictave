<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pictave League · Stats</title>
<style>
:root { --nuit:#2A1236; --profond:#42204F; --violet:#6B3A8C; --moyen:#8E4FB0; --lilas:#DF8FE8; --rose:#F2C4F5;
        --lavande:#F3EAF8; --brume:#E4D3EE; --encre:#26172E; --gris:#6A5E72; --vert:#2E8B57; --rouge:#C0392B; --nul:#A79BB0; }
* { box-sizing: border-box; }
body { margin:0; background:var(--lavande); color:var(--encre); font:15px/1.45 "Segoe UI",Arial,sans-serif; }
header { background:linear-gradient(160deg,var(--nuit) 0%,var(--profond) 45%,var(--moyen) 100%); color:#fff;
         padding:12px 16px 0; box-shadow:0 3px 12px rgba(66,32,79,.35); }
.entete { display:flex; align-items:center; gap:14px; max-width:1100px; margin:0 auto; }
.entete img { height:72px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,.45)); }
h1,h2,h3,nav button,th,.carte-mvp b.rang,.chiffre { font-family:Bahnschrift,"Arial Narrow",sans-serif; font-stretch:condensed; }
h1,h2,h3 { margin:0; text-transform:uppercase; letter-spacing:.02em; }
h1 { font-size:32px; font-weight:700; line-height:1; } h1 span { color:var(--lilas); }
h2 { font-size:24px; font-weight:700; color:var(--profond); margin:24px 0 10px; padding-bottom:3px;
     border-bottom:3px solid; border-image:linear-gradient(90deg,var(--moyen),var(--lilas),transparent) 1; }
h3 { font-size:18px; font-weight:600; color:var(--violet); margin:16px 0 6px; text-align:center; }
.maj { color:var(--rose); font-size:13px; opacity:.85; margin-top:4px; }
nav { display:flex; flex-wrap:wrap; gap:2px; margin:10px auto 0; max-width:1100px; }
nav button { background:none; border:0; color:#E9D9F2; padding:9px 12px; font-size:16px; font-weight:600; cursor:pointer;
             text-transform:uppercase; letter-spacing:.03em; border-bottom:4px solid transparent; }
nav button:hover { color:#fff; }
nav button.actif { border-color:var(--lilas); color:#fff; }
main { max-width:1100px; margin:0 auto; padding:8px 16px 40px; }
.filtres { justify-content:center; display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:#fff; border:1px solid var(--brume);
           padding:10px 12px; border-radius:8px; margin:12px 0; }
select { font-size:15px; padding:4px 6px; border:1px solid var(--brume); border-radius:4px; background:#fff; color:var(--encre); }
.tab { margin:6px 0 4px; text-align:center; }
table { border-collapse:collapse; margin:0 auto; font-size:15px; background:#fff; border-radius:8px; overflow:hidden;
        box-shadow:0 1px 4px rgba(66,32,79,.12); max-width:100%; }
th,td { padding:6px 9px; border-bottom:1px solid var(--brume); text-align:center; vertical-align:middle; }
th:first-child,td:first-child { text-align:left; font-weight:600; }
td.g { text-align:left; }
th { background:var(--profond); color:#fff; font-weight:600; font-size:14px; line-height:1.15; letter-spacing:.02em; cursor:pointer; }
td.n { font-variant-numeric:tabular-nums; }
tr:hover td { background:#F8F1FB; }
.v { color:var(--vert); font-weight:600; } .d { color:var(--rouge); font-weight:600; } .nul { color:var(--nul); }
.lien { color:inherit; text-decoration:none; border-bottom:1px dotted var(--moyen); cursor:pointer; }
.lien:hover { color:var(--moyen); }
.retour { display:inline-block; margin-top:12px; color:var(--violet); font-weight:600; cursor:pointer; text-decoration:none; }
.carte-mvp { background:#fff; border-left:5px solid var(--lilas); padding:10px 14px; margin:8px 0; border-radius:6px;
             box-shadow:0 1px 4px rgba(66,32,79,.12); }
.carte-mvp > div { margin:2px 0; }
.carte-mvp b.rang { font-size:26px; font-weight:700; color:var(--moyen); margin-right:6px; }
.titre-mvp { font-size:17px; }
.cartes-j { list-style:none; padding:0; margin:8px 0 0; font-size:13px; color:var(--gris); }
.cartes-j li { display:grid; grid-template-columns:1fr 70px 70px; gap:8px; border-top:1px dashed var(--brume); padding:3px 0; }
.cartes-j li span:not(:first-child) { text-align:right; font-variant-numeric:tabular-nums; }
.cartes-j li.mvp span:first-child::after { content:" ★"; color:var(--moyen); }
.petit { color:var(--gris); font-size:13px; }
.legende { max-width:820px; margin:6px auto 18px; font-size:13px; color:var(--gris); background:#fff; border:1px solid var(--brume);
           border-radius:8px; padding:8px 14px; }
.legende b { color:var(--profond); }
.legende > div { margin:2px 0; }
.legende.deux { display:grid; grid-template-columns:1fr 1fr; gap:4px 28px; }
.legende.deux .tout { grid-column:1 / -1; text-align:center; }
.intro { max-width:820px; margin:6px auto 12px; color:var(--gris); font-size:14px; text-align:center; }
.ban { color:var(--rouge); } .pk { color:var(--violet); font-weight:600; }
.doute { color:#b36b00; }
.grille { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
.record { background:#fff; border-radius:8px; padding:10px 14px; box-shadow:0 1px 4px rgba(66,32,79,.12); }
.record h3 { text-align:left; margin:0 0 4px; font-size:17px; }
.record ol { margin:4px 0 0; padding-left:22px; } .record li { margin:4px 0; }
.barre { display:inline-block; width:110px; height:10px; background:var(--brume); border-radius:5px; vertical-align:middle;
         margin-right:8px; overflow:hidden; }
.barre span { display:block; height:100%; background:linear-gradient(90deg,var(--moyen),var(--lilas)); border-radius:5px; }
.barre.rouge span { background:linear-gradient(90deg,#9b2d22,#e0786d); }
.spark { vertical-align:middle; }
.resume { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:10px 0; }
.resume div { background:#fff; border-radius:8px; padding:8px 14px; text-align:center; box-shadow:0 1px 4px rgba(66,32,79,.12); min-width:110px; }
.resume .chiffre { display:block; font-size:24px; font-weight:700; color:var(--profond); }
.duo { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:18px; align-items:start; }
.duo > div { min-width:0; }
.duo table { font-size:14px; }
.duo th, .duo td { padding:5px 7px; }
@media (max-width:1150px) { .duo.serre { grid-template-columns:1fr; } }
.lineup { text-align:center; font-size:16px; }
.choix { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:12px; margin:14px 0; font-weight:600; }
.choix select { font-size:16px; }
.tendance { max-width:820px; margin:8px auto; background:#fff; border-radius:8px; padding:10px 16px; box-shadow:0 1px 4px rgba(66,32,79,.12); }
.tendance div { margin:3px 0; }
#verrou { max-width:360px; margin:50px auto; background:#fff; padding:24px; border-radius:12px;
          border-top:6px solid var(--moyen); text-align:center; box-shadow:0 4px 18px rgba(66,32,79,.18); }
#verrou img { width:170px; height:auto; margin-bottom:6px; filter:drop-shadow(0 3px 8px rgba(66,32,79,.35)); }
#verrou .mdp { display:flex; gap:6px; margin:12px 0; }
#verrou input { flex:1; min-width:0; font-size:17px; padding:8px; border:1px solid var(--brume); border-radius:6px; }
#verrou button { font-size:17px; padding:8px 22px; background:linear-gradient(135deg,var(--profond),var(--moyen)); color:#fff;
                 border:0; border-radius:6px; cursor:pointer; font-family:Bahnschrift,sans-serif; text-transform:uppercase; }
#verrou button.oeil { font-size:13px; padding:6px 10px; background:var(--brume); color:var(--profond); min-width:82px; }
@media (max-width:700px) { h1 { font-size:24px; } .entete img { height:52px; } th,td { padding:5px; font-size:13px; }
  .legende.deux, .duo { grid-template-columns:1fr; } nav button { font-size:14px; padding:8px 8px; } }
</style></head><body>

function statsEquipes(ms, mn) {

  mn.forEach(s => s.e.forEach((n,i) => { const x = g(n); x.manj++; const w = s.s[i] > s.s[1-i]; if (w) x.manv++;
    x.pour += s.s[i]; x.contre += s.s[1-i]; const c = x.cartes[s.carte] ??= [0,0,0]; c[w ? 0 : 1]++; c[2] += s.s[i]; }));

function sparkline(pts, dates, n) {

function agregerJoueurs(lignes) {
  const j = {};

function detailPB(p) {

  const rows = D.pickban.filter(r => r.date === p.date && memePaire([r.equipe_1, r.equipe_2], [p.equipe_1, p.equipe_2]));

    <h3>Cartes</h3>${tableau(["Carte","Manches","Bilan","Pts moy.","Choisie","Bannie"], cartes.map(c => { const v = x.cartes[c];
      return [nomCarte(c), v ? v[0] + v[1] : 0, v ? bilan(v[0], v[1]) : `<span class="nul">·</span>`, v ? Math.round(v[2] / (v[0] + v[1])) : "—",
        pb.picks[c] || `<span class="nul">·</span>`, pb.bans[c] || `<span class="nul">·</span>`]; }), [],
      "Choisie / Bannie : nombre de fois, sur les matchs dont le pick & ban est relevé (bans depuis le 23/11).")}
    ${jstats.length ? `<h3>Joueurs</h3>${tableau(["Joueur","Pts","Manches","Moy.","K / D / A","K/D","MVP manche"], jstats.map(j =>
      [lienJ(j.p), j.sc, j.n, Math.round(j.sc/j.n), `${j.k} / ${j.d} / ${j.a}`, ratio(j), j.mvp.length]), [1,2,3,5,6])}` : ""}
    <h3>Adversaires</h3>${tableau(["Adversaire","Matchs","Bilan"], Object.entries(adv).sort((p,q) => (q[1][0]+q[1][1]) - (p[1][0]+p[1][1]))
      .map(([o,t]) => [lienEq(o), t[0] + t[1], bilan(t[0], t[1])]))}
    <h3>Matchs</h3>${tableau(["Date","Div","Adversaire","Score","Cartes"], ms.map(m => { const i = m.e.indexOf(nom);
      return [fmtDate(m.date), "Div " + m.div, lienEq(m.e[1-i]), `<b class="${m.v === nom ? "v" : "d"}">${m.s[i]}-${m.s[1-i]}</b>`,
        D.manches.filter(s => s.m === m.id).map(s => `${nomCarte(s.carte)} ${s.s[i]}-${s.s[1-i]}`).join(" · ")]; }))}`;
}
function ficheJoueur(p) {
  const ls = D.joueurs.filter(l => dansSaison(l) && l.p === p).sort((a,b) => a.date.localeCompare(b.date) || a.m.localeCompare(b.m) || a.n - b.n);
  if (!ls.length) return `<a class="retour" data-retour>← Retour</a><p class="intro">Pas de stats pour ${esc(p)} sur cette saison.</p>`;
  const x = agregerJoueurs(ls)[0], parCarte = {};
  ls.forEach(l => { const c = parCarte[l.carte] ??= {n:0, sc:0, k:0, d:0, a:0, mvp:0}; c.n++; c.sc += l.sc; c.k += l.k; c.d += l.d; c.a += l.a; if (l.mvp) c.mvp++; });
  return `<a class="retour" data-retour>← Retour</a><h2>${esc(p)}</h2>
    <div class="resume"><div><span class="chiffre">${lienEq(x.eq)}</span>équipe</div><div><span class="chiffre">${x.sc}</span>points</div>
      <div><span class="chiffre">${Math.round(x.sc/x.n)}</span>moyenne / manche</div><div><span class="chiffre">${x.k}/${x.d}/${x.a}</span>K/D/A</div>
      <div><span class="chiffre">${ratio(x)}</span>ratio K/D</div><div><span class="chiffre">${x.mvp.length}</span>manches MVP</div></div>
    <h3>Par carte</h3>${tableau(["Carte","Manches","Pts moy.","K / D / A","K/D","MVP"], Object.entries(parCarte).sort((a,b) => b[1].sc/b[1].n - a[1].sc/a[1].n)
      .map(([c,v]) => [nomCarte(c), v.n, Math.round(v.sc/v.n), `${v.k} / ${v.d} / ${v.a}`, ratio(v), v.mvp || `<span class="nul">·</span>`]), [1,2,4])}
    <h3>Manche par manche</h3>${tableau(["Date","Match","Manche","Carte","Score","K / D / A","MVP"], ls.map(l => [fmtDate(l.date), esc(l.match), l.n,
      nomCarte(l.carte), l.sc + (l.doute ? ' <span class="doute">⚠</span>' : ""), `${l.k} / ${l.d} / ${l.a}`, l.mvp ? "★" : ""]), [2,4])}`;
}

// ---------- navigation ----------
const ONGLETS = {accueil:["Accueil", vueAccueil], equipes:["Équipes", vueEquipes], cartes:["Cartes", vueCartes],
  joueurs:["Joueurs & MVP", vueJoueurs], records:["Records", vueRecords], soirees:["Soirées", vueSoirees],
  picks:["Pick & ban", vuePicks], face:["Face-à-face", vueFace], duels:["Duels", vueDuels]};
const SANS_FILTRES = ["accueil", "face"];
function rendre() {
  document.getElementById("nav").innerHTML = Object.entries(ONGLETS).map(([k,[t]]) =>
    `<button data-o="${k}" class="${k === onglet && !fiche ? "actif" : ""}">${t}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { onglet = b.dataset.o; fiche = null;
    try { localStorage.setItem("onglet", onglet); } catch(e) {} rendre(); });
  let h;
  if (fiche) h = fiche.type === "eq" ? ficheEquipe(fiche.nom) : ficheJoueur(fiche.nom);
  else h = (SANS_FILTRES.includes(onglet) ? "" : barreFiltres()) + ONGLETS[onglet][1]();
  document.getElementById("main").innerHTML = h;
  brancherFiltres(); triable();
  const fa = document.getElementById("fa"), fb = document.getElementById("fb");
  if (fa) { fa.onchange = e => { FA.a = e.target.value; rendre(); }; fb.onchange = e => { FA.b = e.target.value; rendre(); }; }
  const da = document.getElementById("da"), db = document.getElementById("db"), acc = document.getElementById("acc");
  if (da) { da.onchange = e => { DU.a = e.target.value; rendre(); }; db.onchange = e => { DU.b = e.target.value; rendre(); }; }
  if (acc) acc.onchange = e => { ACC = +e.target.value; rendre(); };
}
function demarrer() {
  F.saison = saisons()[0] || null;
  try { onglet = localStorage.getItem("onglet") || onglet; if (!ONGLETS[onglet]) onglet = "accueil"; } catch(e) {}
  document.getElementById("maj").textContent = "Mise à jour : " + D.maj + " · source competitive.eva.gg + VOD Twitch";
  document.getElementById("main").addEventListener("click", e => {
    const a = e.target.closest("[data-eq],[data-j],[data-retour]"); if (!a) return; e.preventDefault();
    if (a.hasAttribute("data-retour")) fiche = null;
    else fiche = a.hasAttribute("data-eq") ? {type:"eq", nom:a.dataset.eq} : {type:"j", nom:a.dataset.j};
    rendre(); window.scrollTo(0, 0);
  });
  rendre();
}
init();
</script></body></html>
