<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Pictave League · Stats</title>
<script>let t0 = "dark"; try { t0 = localStorage.getItem("theme") || "dark"; } catch(e) {} document.documentElement.dataset.theme = t0;</script>
<style>
:root { --bg:#F5F1F8; --surface:#FFFFFF; --surface-2:#F1EAF6; --zebre:#FBF8FD; --survol:#F4ECF9; --ligne:#E6DCEC;
  --encre:#22172A; --encre-2:#5E5168; --accent:#7A3FA0; --accent-doux:#EFE3F6; --vert:#1E8449; --rouge:#C0392B; --nul:#9B8FA5;

  --survol:#2C2334; --ligne:#382C40; --encre:#F2ECF6; --encre-2:#B9ABC4; --accent:#CFA2EC; --accent-doux:#35273F; --vert:#5BD08A;
  --rouge:#FF8A7A; --nul:#857891; --barre-a:#B57AD8; --barre-b:#E9A8EF; --ombre:0 1px 2px rgba(0,0,0,.4); } }
:root[data-theme="dark"] { --bg:#141016; --surface:#1E1822; --surface-2:#2A2130; --zebre:#221B27;
  --survol:#2C2334; --ligne:#382C40; --encre:#F2ECF6; --encre-2:#B9ABC4; --accent:#CFA2EC; --accent-doux:#35273F; --vert:#5BD08A;
  --rouge:#FF8A7A; --nul:#857891; --barre-a:#B57AD8; --barre-b:#E9A8EF; --ombre:0 1px 2px rgba(0,0,0,.4); }
@font-face { font-family:"Barlow Condensed"; src:url(polices/BarlowCondensed-Medium.ttf); font-weight:500; font-display:swap; }
@font-face { font-family:"Barlow Condensed"; src:url(polices/BarlowCondensed-SemiBold.ttf); font-weight:600; font-display:swap; }
@font-face { font-family:"Barlow Condensed"; src:url(polices/BarlowCondensed-Bold.ttf); font-weight:700; font-display:swap; }
:root { --eqA:#2F5BC4; --eqB:#8E3A88; }
* { box-sizing:border-box; }
html { scroll-padding-top:116px; }
body { margin:0; background:var(--bg); color:var(--encre); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif; }
.marque, h1, h2, .chiffre, .carte-mvp b.rang, #nav button, .tuile .val, .podium .rg, .podium .val, .miroir .lab, .vs-tete div, .match-c .num, .lst .r {
  font-family:"Barlow Condensed",Bahnschrift,"Arial Narrow",sans-serif; }
.nw { white-space:nowrap; }
/* barre du haut */
.haut { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; padding:8px 18px; color:#fff;
  background:linear-gradient(120deg,#2A1236 0%,#42204F 50%,#8E4FB0 100%); box-shadow:0 2px 10px rgba(30,10,40,.3); }

.marque span { color:#DF8FE8; }
.recherche { position:relative; flex:1; max-width:420px; margin-left:auto; }
.recherche input { width:100%; font:inherit; font-size:14px; padding:7px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.14); color:#fff; outline:none; }
.recherche input::placeholder { color:rgba(255,255,255,.7); }
.recherche input:focus { background:#fff; color:#22172A; }
.res { position:absolute; top:40px; left:0; right:0; background:var(--surface); color:var(--encre); border-radius:10px; box-shadow:0 8px 28px rgba(0,0,0,.25);

/* menu horizontal + bandeau + contenu */
#nav { position:sticky; top:56px; z-index:15; display:flex; align-items:center; gap:2px; overflow-x:auto; scrollbar-width:none;
  padding:0 max(18px, calc((100% - 1320px) / 2 + 24px)); background:var(--surface); border-bottom:1px solid var(--ligne); }
#nav .sep { flex:none; width:1px; height:22px; background:var(--ligne); margin:0 10px; }

#nav button:hover { color:var(--encre); }
#nav button.actif { color:var(--accent); border-bottom-color:var(--accent); }
.ticker { overflow:hidden; border-bottom:1px solid var(--ligne); }
.ticker .piste { display:flex; gap:10px; width:max-content; padding:8px 10px 8px 0; animation:defile 70s linear infinite; }
.ticker:hover .piste { animation-play-state:paused; }
@keyframes defile { from { transform:translateX(0); } to { transform:translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .ticker { overflow-x:auto; } .ticker .piste { animation:none; } }
.tk { display:grid; grid-template-columns:1fr auto; gap:0 14px; min-width:200px; background:var(--surface); border:1px solid var(--ligne);

.tk .info { grid-column:1 / -1; font-size:11px; color:var(--encre-2); text-transform:uppercase; letter-spacing:.05em; }
.tk .g { font-weight:700; } .tk .p { color:var(--encre-2); } .tk b { text-align:right; font-variant-numeric:tabular-nums; }
.tk:hover { border-color:var(--accent); }
.cadre { max-width:1320px; margin:0 auto; }
.maj { font-size:12px; color:var(--encre-2); text-align:center; padding:10px 20px 30px; }
main { padding:18px 24px 30px; min-width:0; }
/* titres */
.titre-page { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
h1 { margin:0; font-size:42px; line-height:1.1; font-weight:700; text-transform:uppercase; letter-spacing:.01em; color:var(--encre); }
h2 { font-size:24px; font-weight:700; margin:30px 0 10px; color:var(--encre); text-transform:uppercase; letter-spacing:.02em; }
/* tuiles et blocs (accueil, joueurs) */
.tuiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:14px 0; }
.tuile, .bloc { background:var(--surface); border:1px solid var(--ligne); border-radius:12px; padding:12px 16px; box-shadow:var(--ombre); }

.bloc { display:flex; flex-direction:column; }

.voir { margin-top:auto; padding-top:8px; text-align:center; }

.lst { list-style:none; margin:0; padding:0; }

.lst .r { font-size:19px; font-weight:700; color:var(--encre-2); }
.lst li:first-child .r { color:var(--accent); }
.lst .s { display:block; font-size:12px; color:var(--encre-2); }
.lst .x { font-weight:700; font-variant-numeric:tabular-nums; }

.podium .val { font-size:48px; font-weight:700; line-height:1; }
.podium .nom { padding:10px 16px; font-weight:700; } .podium .nom .petit { display:block; font-weight:400; }
/* comparateur en miroir */
.vs-tete { display:grid; grid-template-columns:1fr auto 1fr; max-width:780px; margin:14px auto 8px; border-radius:12px; overflow:hidden; }
.vs-tete div { padding:12px 14px; font-size:26px; font-weight:700; text-transform:uppercase; color:#fff; text-align:center; }
.vs-tete .a { background:var(--eqA); } .vs-tete .b { background:var(--eqB); }

.vs-tete .lien { color:#fff; border-bottom-color:rgba(255,255,255,.5); }
.miroir { max-width:780px; margin:0 auto 10px; display:grid; gap:4px; }
.miroir .l { display:grid; grid-template-columns:minmax(0,1fr) 220px minmax(0,1fr); background:var(--surface);
  border:1px solid var(--ligne); border-radius:8px; overflow:hidden; }
.miroir .va, .miroir .vb { padding:7px 12px; font-weight:600; font-variant-numeric:tabular-nums; }
.miroir .va { border-left:4px solid var(--eqA); } .miroir .vb { text-align:right; border-right:4px solid var(--eqB); }
.miroir .mieux { background:var(--accent-doux); }
.miroir .lab { display:flex; align-items:center; justify-content:center; text-align:center; padding:6px 10px; font-size:16px; font-weight:600;
  text-transform:uppercase; letter-spacing:.03em; color:var(--encre-2); background:var(--surface-2); }
.miroir .grp { text-align:center; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--encre-2); margin:10px 0 2px; }
/* matchs en cartes */
.matchs { display:grid; gap:10px; margin:6px 0 16px; }
.match-c { display:grid; grid-template-columns:46px minmax(180px,1.2fr) minmax(0,2fr) minmax(110px,.8fr) minmax(150px,1fr); gap:6px 18px;

.match-c .num { font-size:32px; font-weight:700; color:var(--nul); opacity:.6; }
.eqs > div { display:flex; justify-content:space-between; gap:10px; }
.eqs .g { font-weight:700; } .eqs .p { color:var(--encre-2); } .eqs b { font-variant-numeric:tabular-nums; }
.champ .et { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--encre-2); }
.champ .vl { font-size:14px; }
@media (max-width:900px) { .match-c { grid-template-columns:36px 1fr; } .match-c .champ { grid-column:2; } .bento { grid-template-columns:1fr; } }
h3 { font-size:15px; font-weight:650; margin:16px 0 8px; color:var(--encre-2); text-transform:uppercase; letter-spacing:.04em; text-align:center; }
.bouton { background:var(--surface); color:var(--encre); border:1px solid var(--ligne); border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }
.bouton:hover { background:var(--survol); }
.sommaire { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px; }
.sommaire a { font-size:13px; padding:4px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--ligne); color:var(--encre-2); text-decoration:none; }
.sommaire a:hover { color:var(--accent); border-color:var(--accent); }
/* filtres */
.filtres { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin:14px 0 4px; font-size:14px; color:var(--encre-2); }
select { font:inherit; font-size:14px; padding:5px 8px; border:1px solid var(--ligne); border-radius:8px; background:var(--surface); color:var(--encre); }
/* tableaux */
.tab { margin:6px 0 6px; display:flex; justify-content:center; }
table { border-collapse:separate; border-spacing:0; font-size:14px; background:var(--surface); border-radius:12px; box-shadow:var(--ombre);
  border:1px solid var(--ligne); overflow:hidden; max-width:100%; }
th, td { padding:8px 12px; text-align:center; vertical-align:middle; border-bottom:1px solid var(--ligne); }
tbody tr:last-child td { border-bottom:0; }
th { background:var(--surface-2); color:var(--encre-2); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; line-height:1.2; cursor:pointer; }
th:first-child, td:first-child { text-align:left; }
td:first-child { font-weight:600; }
td.g { text-align:left; }
td.n { font-variant-numeric:tabular-nums; }
tbody tr:nth-child(even) td { background:var(--zebre); }
tbody tr:hover td { background:var(--survol); }
.v { color:var(--vert); font-weight:600; } .d { color:var(--rouge); font-weight:600; } .nul { color:var(--nul); }
.ban { color:var(--rouge); } .pk { color:var(--accent); font-weight:600; }
.lien { color:inherit; text-decoration:none; border-bottom:1px dotted var(--accent); cursor:pointer; }
.lien:hover { color:var(--accent); }
.petit { color:var(--encre-2); font-size:12.5px; }
.doute { color:#C77C00; }
.legende { max-width:860px; margin:8px auto 20px; font-size:13px; color:var(--encre-2); background:var(--surface-2); border-radius:10px; padding:9px 14px; }
.legende b { color:var(--encre); }
.legende > div { margin:2px 0; }
.legende.deux { display:grid; grid-template-columns:1fr 1fr; gap:4px 28px; }
.legende.deux .tout { grid-column:1 / -1; text-align:center; }
.intro { max-width:820px; margin:8px auto 12px; color:var(--encre-2); font-size:14px; text-align:center; }
/* cartes, tuiles */
.grille { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:14px; }
.carte, .carte-mvp, .record { background:var(--surface); border:1px solid var(--ligne); border-radius:12px; padding:12px 16px; box-shadow:var(--ombre); }
.carte-mvp > div { margin:2px 0; }
.carte-mvp b.rang { font-size:28px; font-weight:700; color:var(--accent); margin-right:8px; }
.titre-mvp { font-size:17px; }
.cartes-j { list-style:none; padding:0; margin:8px 0 0; font-size:13px; color:var(--encre-2); }
.cartes-j li { display:grid; grid-template-columns:1fr 70px 70px; gap:8px; border-top:1px solid var(--ligne); padding:4px 0; }
.cartes-j li span:not(:first-child) { text-align:right; font-variant-numeric:tabular-nums; }
.cartes-j li.mvp span:first-child::after { content:" ★"; color:var(--accent); }
.record h3 { text-align:left; margin:0 0 4px; }
.record ol { margin:4px 0 0; padding-left:22px; } .record li { margin:5px 0; }
.resume { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin:12px 0; }
.resume > div { background:var(--surface); border:1px solid var(--ligne); border-radius:12px; padding:10px 16px; text-align:center; box-shadow:var(--ombre);
  min-width:120px; font-size:13px; color:var(--encre-2); }
.resume .chiffre { display:block; font-size:26px; font-weight:700; color:var(--encre); line-height:1.15; }
.barre { display:inline-block; width:110px; height:8px; background:var(--surface-2); border-radius:4px; vertical-align:middle; margin-right:8px; overflow:hidden; }
.barre span { display:block; height:100%; background:linear-gradient(90deg,var(--barre-a),var(--barre-b)); border-radius:4px; }
.barre.rouge span { background:var(--rouge); }
.choix { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; margin:14px 0; font-weight:600; }
.choix select { font-size:15px; font-weight:600; }
.duo { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px; align-items:start; }
.duo > div { min-width:0; }

.phrases { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
.phrases li { background:var(--surface); border:1px solid var(--ligne); border-left:4px solid var(--accent); border-radius:10px; padding:9px 14px; font-size:15px; box-shadow:var(--ombre); }
.phrases li .tag { display:inline-block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); margin-right:8px; }
.lineup { text-align:center; font-size:15px; }
.tendance { max-width:820px; margin:8px auto; }
.tendance div { margin:3px 0; }
.ok { color:var(--vert); font-weight:600; }
/* accès */
#verrou { max-width:360px; margin:60px auto; background:var(--surface); border:1px solid var(--ligne); padding:26px; border-radius:16px; text-align:center; box-shadow:var(--ombre); }
#verrou img { width:160px; height:auto; margin-bottom:6px; }
#verrou h2 { margin:6px 0 0; }
#verrou .mdp { display:flex; gap:6px; margin:14px 0; }
#verrou input { flex:1; min-width:0; font:inherit; font-size:16px; padding:8px 10px; border:1px solid var(--ligne); border-radius:8px; background:var(--surface); color:var(--encre); }
#verrou button { font:inherit; font-size:15px; font-weight:600; padding:8px 22px; background:linear-gradient(135deg,#42204F,#8E4FB0); color:#fff; border:0; border-radius:8px; cursor:pointer; }
#verrou button.oeil { font-size:13px; font-weight:500; padding:6px 10px; background:var(--surface-2); color:var(--encre); min-width:82px; }
@media (max-width:1150px) { .duo.serre { grid-template-columns:1fr; } }
@media (max-width:700px) { .marque { font-size:17px; } .haut img { height:32px; } main { padding:12px; } th, td { padding:6px; font-size:13px; }
  .legende.deux, .duo, .podium { grid-template-columns:1fr; } .miroir .l { grid-template-columns:minmax(0,1fr) 120px minmax(0,1fr); }
  .tab { justify-content:flex-start; overflow-x:auto; } .haut { gap:8px; padding:8px 10px; } .marque span { display:none; } .bouton-haut .txt { display:none; } h1 { font-size:32px; } }

<div class="haut"><img src="logo.png" alt=""><div class="marque">Pictave League <span>· Stats</span></div>
  <div class="recherche"><input id="q" type="search" placeholder="Rechercher une équipe ou un joueur ( / )" autocomplete="off" aria-label="Rechercher" disabled>
    <div id="res" class="res" hidden></div></div>
  <button class="bouton-haut" id="theme" type="button" title="Changer de thème"><span id="theme-ic">◐</span> <span class="txt" id="theme-txt">Mode sombre</span></button></div>
<nav id="nav" aria-label="Rubriques"></nav><div id="ticker" class="ticker" hidden></div>

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ratio = x => (x.k / Math.max(x.d, 1)).toFixed(2);

const pl = (n, mot) => `${n} ${mot}${n > 1 ? "s" : ""}`;
const memePaire = (a, b) => [...a].sort().join("|") === [...b].sort().join("|");
const lienEq = n => `<a href="#equipe/${encodeURIComponent(n)}" class="lien" data-eq="${esc(n)}">${esc(n)}</a>`;

const sansAccent = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
let D, F = {saison:null, mois:"tous", div:"toutes"}, onglet = "accueil", fiche = null,
    FA = {a:null, b:null}, DU = {a:null, b:null}, CA = {a:null, b:null, carte:""}, ACC = null, JST = null;

function miroir(A, B, lignes) {
  return `<div class="vs-tete"><div class="a">${lienEq(A)}</div><div class="m">VS</div><div class="b">${lienEq(B)}</div></div>
    <div class="miroir">${lignes.map(l => { if (typeof l === "string") return `<div class="grp">${l}</div>`;
      const [lab, va, vb, na, nb, sens] = l, ok = sens && na != null && nb != null && na !== nb;
      const ma = ok && (sens > 0 ? na > nb : na < nb), mb = ok && !ma;
      return `<div class="l"><div class="va${ma ? " mieux" : ""}">${va}</div><div class="lab">${lab}</div><div class="vb${mb ? " mieux" : ""}">${vb}</div></div>`; }).join("")}</div>`;
}
const STATS_J = {
  moyenne:["Moyenne par manche", x => x.sc / x.n, x => Math.round(x.sc / x.n), 3],
  kd:["Ratio K/D", x => x.k / Math.max(x.d, 1), x => ratio(x), 3],
  kills:["Kills", x => x.k, x => x.k, 0],
  assists:["Assistances", x => x.a, x => x.a, 0],
  mvp:["MVP de manche", x => x.mvp.length, x => x.mvp.length, 0],
  record:["Meilleur score en une manche", x => Math.max(...x.det.map(l => l.sc)), x => Math.max(...x.det.map(l => l.sc)), 0],
  points:["Points", x => x.sc, x => x.sc, 0]};
const classerStat = (cl, k) => { const f = STATS_J[k][1], min = STATS_J[k][3];
  return cl.filter(x => x.n >= min).sort((a,b) => f(b) - f(a) || b.sc - a.sc); };

function majBoutonTheme() { const sombre = themeActuel() === "dark";

// ---------- accès ----------
async function dechiffrer(mdp) {
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  const cle = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(CHARGE.sel), iterations:200000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const clair = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(CHARGE.iv)}, cle, b(CHARGE.ct));
  return JSON.parse(new TextDecoder().decode(clair));
}
function verrou() {
  document.getElementById("main").innerHTML = `<div id="verrou"><img src="logo.png" alt=""><h2>Accès réservé</h2>
    <div class="mdp"><input type="password" id="mdp" placeholder="Mot de passe" autocomplete="current-password" autofocus>
    <button type="button" class="oeil" id="oeil" aria-pressed="false">Afficher</button></div>
    <button id="ok">Entrer</button><p class="petit" id="err"></p></div>`;
  const champ = document.getElementById("mdp"), oeil = document.getElementById("oeil");
  oeil.onclick = () => { const voir = champ.type === "password"; champ.type = voir ? "text" : "password";
    oeil.textContent = voir ? "Masquer" : "Afficher"; oeil.setAttribute("aria-pressed", String(voir)); champ.focus(); };
  const go = async () => {
    try { const mdp = champ.value; D = await dechiffrer(mdp);
          try { sessionStorage.setItem("mdp", mdp); } catch(e) {} demarrer(); }
    catch(e) { document.getElementById("err").textContent = "Mot de passe incorrect."; }
  };
  document.getElementById("ok").onclick = go;
  champ.onkeydown = e => { if (e.key === "Enter") go(); };
}
async function init() {
  if (!CHARGE.ct) { D = CHARGE; return demarrer(); }
  let m = null; try { m = sessionStorage.getItem("mdp"); } catch(e) {}
  if (m) { try { D = await dechiffrer(m); return demarrer(); } catch(e) {} }
  verrou();
}

function detailPB(p) {

function demarrer() {

function ticker() {
