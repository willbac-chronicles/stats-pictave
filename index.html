<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pictave League · Stats</title>
<style>
:root { --nuit:#2A1236; --profond:#42204F; --violet:#6B3A8C; --moyen:#8E4FB0; --lilas:#DF8FE8; --rose:#F2C4F5;
        --lavande:#F3EAF8; --brume:#E4D3EE; --encre:#26172E; --gris:#6A5E72; --vert:#2E8B57; --rouge:#C0392B; }
* { box-sizing: border-box; }
body { margin:0; background:var(--lavande); color:var(--encre); font:15px/1.45 "Segoe UI",Arial,sans-serif; }
header { background:linear-gradient(160deg,var(--nuit) 0%,var(--profond) 45%,var(--moyen) 100%); color:#fff;
         padding:12px 16px 0; box-shadow:0 3px 12px rgba(66,32,79,.35); }
.entete { display:flex; align-items:center; gap:14px; max-width:1100px; margin:0 auto; }
.entete img { height:72px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,.45)); }
h1,h2,h3,nav button,th,.carte-mvp b.rang { font-family:Bahnschrift,"Arial Narrow",sans-serif; font-stretch:condensed; }
h1,h2,h3 { margin:0; text-transform:uppercase; letter-spacing:.02em; }
h1 { font-size:32px; font-weight:700; line-height:1; } h1 span { color:var(--lilas); }
h2 { font-size:24px; font-weight:700; color:var(--profond); margin:22px 0 8px; padding-bottom:3px;
     border-bottom:3px solid; border-image:linear-gradient(90deg,var(--moyen),var(--lilas),transparent) 1; }
h3 { font-size:18px; font-weight:600; color:var(--violet); margin:14px 0 6px; }
.maj { color:var(--rose); font-size:13px; opacity:.85; margin-top:4px; }
nav { display:flex; flex-wrap:wrap; gap:4px; margin:10px auto 0; max-width:1100px; }
nav button { background:none; border:0; color:#E9D9F2; padding:9px 14px; font-size:16px; font-weight:600; cursor:pointer;
             text-transform:uppercase; letter-spacing:.03em; border-bottom:4px solid transparent; }
nav button:hover { color:#fff; }
nav button.actif { border-color:var(--lilas); color:#fff; }
main { max-width:1100px; margin:0 auto; padding:8px 16px 40px; }
.filtres { display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:#fff; border:1px solid var(--brume);
           padding:10px 12px; border-radius:8px; margin:12px 0; }
select { font-size:15px; padding:4px 6px; border:1px solid var(--brume); border-radius:4px; background:#fff; color:var(--encre); }
.tab { overflow-x:auto; border-radius:8px; }
table { border-collapse:collapse; width:100%; margin:6px 0 14px; font-size:14px; background:#fff; }
th,td { padding:6px 8px; border-bottom:1px solid var(--brume); text-align:left; white-space:nowrap; }
th { background:var(--profond); color:#fff; font-weight:600; font-size:15px; letter-spacing:.02em; position:sticky; top:0; cursor:pointer; }
td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
tr:hover td { background:#F8F1FB; }
.v { color:var(--vert); font-weight:600; } .d { color:var(--rouge); font-weight:600; }
.carte-mvp { background:#fff; border-left:5px solid var(--lilas); padding:10px 14px; margin:8px 0; border-radius:6px;
             box-shadow:0 1px 4px rgba(66,32,79,.12); }
.carte-mvp b.rang { font-size:26px; font-weight:700; color:var(--moyen); margin-right:6px; }
.petit { color:var(--gris); font-size:13px; }
.doute { color:#b36b00; }
.grille { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
#verrou { max-width:360px; margin:50px auto; background:#fff; padding:24px; border-radius:12px;
          border-top:6px solid var(--moyen); text-align:center; box-shadow:0 4px 18px rgba(66,32,79,.18); }
#verrou img { width:170px; height:auto; margin-bottom:6px; filter:drop-shadow(0 3px 8px rgba(66,32,79,.35)); }
#verrou input { font-size:17px; padding:8px; width:100%; margin:12px 0; border:1px solid var(--brume); border-radius:6px; }
#verrou button { font-size:17px; padding:8px 22px; background:linear-gradient(135deg,var(--profond),var(--moyen)); color:#fff;
                 border:0; border-radius:6px; cursor:pointer; font-family:Bahnschrift,sans-serif; text-transform:uppercase; }
@media (max-width:600px) { h1 { font-size:24px; } .entete img { height:52px; } th,td { padding:5px; font-size:13px; } }
</style></head><body>

const CARTES = {the_cliff:"The Cliff", reef_point:"Reef Point", ceres:"Cérès", engine:"Engine", atlantis:"Atlantis",
  polaris:"Polaris", silva:"Silva", outlaw:"Outlaw", non_renseignee:"(non renseignée)"};
const nomCarte = c => CARTES[c] || (c||"?").replace(/_/g," ").replace(/\b\w/g, x => x.toUpperCase());
const ORDRE_MOIS = ["Janvier","Fevrier","Février","Mars","Avril","Mai","Juin","Juillet","Aout","Août","Septembre","Octobre","Novembre","Decembre","Décembre"];
let D, F = {saison:null, mois:"tous", div:"toutes"}, onglet = "equipes";
const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function dechiffrer(mdp) {
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  const cle = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(CHARGE.sel), iterations:200000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const clair = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(CHARGE.iv)}, cle, b(CHARGE.ct));
  return JSON.parse(new TextDecoder().decode(clair));
}
function verrou() {
  document.getElementById("main").innerHTML = `<div id="verrou"><img src="logo.png" alt=""><h2>Accès réservé</h2>
    <input type="password" id="mdp" placeholder="Mot de passe" autofocus><br><button id="ok">Entrer</button>
    <p class="petit" id="err"></p></div>`;
  const go = async () => {
    try { const mdp = document.getElementById("mdp").value; D = await dechiffrer(mdp);
          try { sessionStorage.setItem("mdp", mdp); } catch(e) {} demarrer(); }
    catch(e) { document.getElementById("err").textContent = "Mot de passe incorrect."; }
  };
  document.getElementById("ok").onclick = go;
  document.getElementById("mdp").onkeydown = e => { if (e.key === "Enter") go(); };
}
async function init() {
  if (!CHARGE.ct) { D = CHARGE; return demarrer(); }
  let m = null; try { m = sessionStorage.getItem("mdp"); } catch(e) {}
  if (m) { try { D = await dechiffrer(m); return demarrer(); } catch(e) {} }
  verrou();
}

// ---------- filtres ----------
const saisons = () => [...new Set(D.matchs.map(m => m.saison).filter(Boolean))].sort().reverse();
const filtre = x => (!F.saison || x.saison === F.saison || (x.saison === undefined && saisonDeDate(x.date) === F.saison))
  && (F.mois === "tous" || x.mois === F.mois) && (F.div === "toutes" || String(x.div) === F.div);
function saisonDeDate(date) { const m = D.matchs.find(x => x.date === date); return m ? m.saison : F.saison; }
function barreFiltres() {
  const mois = [...new Set(D.matchs.filter(m => !F.saison || m.saison === F.saison).map(m => m.mois))]
    .sort((a,b) => ORDRE_MOIS.indexOf(a) - ORDRE_MOIS.indexOf(b));
  const divs = [...new Set(D.matchs.map(m => m.div).filter(Boolean))].sort();
  return `<div class="filtres">
   <label>Saison <select id="fs">${saisons().map(s => `<option ${s===F.saison?"selected":""}>${s}</option>`).join("")}</select></label>
   <label>Mois <select id="fm"><option value="tous">tous</option>${mois.map(m => `<option ${m===F.mois?"selected":""}>${m}</option>`).join("")}</select></label>
   <label>Division <select id="fd"><option value="toutes">toutes</option>${divs.map(d => `<option value="${d}" ${String(d)===F.div?"selected":""}>Div ${d}</option>`).join("")}</select></label>
  </div>`;
}
function brancherFiltres() {
  const s = document.getElementById("fs"); if (!s) return;
  s.onchange = e => { F.saison = e.target.value; F.mois = "tous"; rendre(); };
  document.getElementById("fm").onchange = e => { F.mois = e.target.value; rendre(); };
  document.getElementById("fd").onchange = e => { F.div = e.target.value; rendre(); };
}
function tableau(entetes, lignes, num = []) {
  return `<div class="tab"><table><thead><tr>${entetes.map((h,i) => `<th class="${num.includes(i)?"n":""}">${h}</th>`).join("")}</tr></thead>
   <tbody>${lignes.map(l => `<tr>${l.map((c,i) => `<td class="${num.includes(i)?"n":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function triable() {
  document.querySelectorAll("th").forEach(th => th.onclick = () => {
    const tb = th.closest("table").tBodies[0], i = [...th.parentNode.children].indexOf(th);
    const asc = th.dataset.asc !== "1"; th.dataset.asc = asc ? "1" : "0";
    const val = td => { const t = td.textContent.replace(/[^\d.,-]/g,"").replace(",","."); return t && !isNaN(+t) ? +t : td.textContent; };
    [...tb.rows].sort((a,b) => { const x = val(a.cells[i]), y = val(b.cells[i]);
      return (x > y ? 1 : x < y ? -1 : 0) * (asc ? 1 : -1); }).forEach(r => tb.appendChild(r));
  });
}
const pct = (a,b) => b ? Math.round(100*a/b) + " %" : "—";

// ---------- onglets ----------
function vueEquipes() {
  const ms = D.matchs.filter(filtre), mn = D.manches.filter(filtre), eq = {};
  const g = n => eq[n] ??= {mj:0, mv:0, manj:0, manv:0, pour:0, contre:0, forme:[], cartes:{}};
  [...ms].sort((a,b) => a.date.localeCompare(b.date)).forEach(m => m.e.forEach((n,i) => {
    const x = g(n); x.mj++; const gagne = m.v === n; if (gagne) x.mv++; x.forme.push(gagne ? "V" : "D"); }));
  mn.forEach(s => s.e.forEach((n,i) => { const x = g(n); x.manj++; if (s.s[i] > s.s[1-i]) x.manv++;
    x.pour += s.s[i]; x.contre += s.s[1-i];
    const c = x.cartes[s.carte] ??= [0,0]; c[s.s[i] > s.s[1-i] ? 0 : 1]++; }));
  const lignes = Object.entries(eq).sort((a,b) => b[1].mv - a[1].mv || b[1].manv - a[1].manv).map(([n,x]) => {
    const best = Object.entries(x.cartes).filter(([,v]) => v[0]+v[1] >= 2).sort((a,b) => b[1][0]/(b[1][0]+b[1][1]) - a[1][0]/(a[1][0]+a[1][1]))[0];
    return [esc(n), x.mj, `<span class="v">${x.mv}</span>-<span class="d">${x.mj-x.mv}</span>`,
      `${x.manv}-${x.manj-x.manv}`, pct(x.manv, x.manj), x.manj ? Math.round(x.pour/x.manj) : "—",
      x.manj ? Math.round(x.contre/x.manj) : "—",
      x.forme.slice(-5).map(f => `<span class="${f==="V"?"v":"d"}">${f}</span>`).join(" "),
      best ? `${nomCarte(best[0])} (${best[1][0]}-${best[1][1]})` : "—"];
  });
  // face-à-face
  const noms = Object.keys(eq).sort(), ff = {};
  ms.forEach(m => { const k = m.e.join("|"), k2 = [...m.e].reverse().join("|");
    ff[k] ??= [0,0]; ff[k2] ??= [0,0]; ff[k][m.v === m.e[0] ? 0 : 1]++; ff[k2][m.v === m.e[1] ? 0 : 1]++; });
  const matrice = noms.length <= 12 ? tableau(["", ...noms.map(esc)],
    noms.map(a => [esc(a), ...noms.map(b => a === b ? "·" : ff[a+"|"+b] ? `${ff[a+"|"+b][0]}-${ff[a+"|"+b][1]}` : "")])) : "";
  return `<h2>Équipes</h2>${tableau(["Équipe","Matchs","V-D","Manches","% manches","Pts pour /manche","Pts contre /manche","Forme (5 derniers)","Meilleure carte (≥2)"], lignes, [1,4,5,6])}
    ${matrice ? `<h2>Face-à-face (matchs, V-D de la ligne)</h2>${matrice}` : ""}
    ${D.classement.length && F.mois === "tous" ? `<h2>Classement officiel du circuit</h2>${tableau(["#","Équipe","Points","Joués"], D.classement.map(c => [c.rang, esc(c.equipe), c.points, c.joues ?? ""]), [0,2,3])}` : ""}`;
}
function vueCartes() {
  const mn = D.manches.filter(filtre), c = {};
  mn.forEach(s => { const x = c[s.carte] ??= {n:0, serrees:0, ecrasees:0, ecart:0, eq:{}};
    x.n++; const ec = Math.abs(s.s[0]-s.s[1]); x.ecart += ec; if (Math.min(...s.s) >= 80) x.serrees++; if (Math.min(...s.s) <= 10) x.ecrasees++;
    s.e.forEach((n,i) => { const e = x.eq[n] ??= [0,0]; e[s.s[i] > s.s[1-i] ? 0 : 1]++; }); });
  const tot = mn.length;
  const lignes = Object.entries(c).sort((a,b) => b[1].n - a[1].n).map(([k,x]) => [nomCarte(k), x.n, pct(x.n, tot),
    x.serrees, x.ecrasees, Math.round(x.ecart / x.n)]);
  const equipes = [...new Set(mn.flatMap(s => s.e))].sort(), cartes = Object.keys(c).sort();
  const mat = tableau(["Équipe", ...cartes.map(nomCarte)], equipes.map(e => [esc(e), ...cartes.map(k => {
    const v = c[k].eq[e]; return v ? `<span class="${v[0]>=v[1]?"v":"d"}">${v[0]}-${v[1]}</span>` : ""; })]));
  return `<h2>Cartes</h2>${tableau(["Carte","Manches","Part","Serrées (perdant ≥ 80)","Écrasées (perdant ≤ 10)","Écart moyen"], lignes, [1,2,3,4,5])}
    <h2>Victoires-défaites par équipe et par carte (manches)</h2>${mat}`;
}
function agregerJoueurs(lignes) {
  const j = {};
  lignes.forEach(l => { const x = j[l.j+"|"+l.eq] ??= {j:l.j, eq:l.eq, sc:0, k:0, d:0, a:0, n:0, mvp:[], doute:false, det:[]};
    x.sc += l.sc; x.k += l.k; x.d += l.d; x.a += l.a; x.n++; x.doute ||= l.doute; x.det.push(l); if (l.mvp) x.mvp.push(l); });
  return Object.values(j).sort((a,b) => b.sc - a.sc || (b.k/Math.max(b.d,1)) - (a.k/Math.max(a.d,1)) || b.k - a.k);
}
function carteMvp(x, rang) {
  return `<div class="carte-mvp"><b class="rang">${rang}</b><b>${esc(x.j)}</b> <span class="petit">${esc(x.eq)}</span>${x.doute?' <span class="doute" title="valeur lue avec doute">⚠</span>':""}<br>
    <b>${x.sc} pts</b> sur ${x.n} manche(s) · moy. ${Math.round(x.sc/x.n)} · K/D/A ${x.k}/${x.d}/${x.a} (ratio ${(x.k/Math.max(x.d,1)).toFixed(2)})
    ${x.mvp.length ? `<br>MVP de manche : ${x.mvp.map(l => `${nomCarte(l.carte)} (${l.sc})`).join(", ")}` : ""}
    <div class="petit">${x.det.map(l => `${nomCarte(l.carte)} ${l.sc} · ${l.k}/${l.d}/${l.a}`).join(" — ")}</div></div>`;
}
function vueJoueurs() {
  const lignes = D.joueurs.filter(filtre);
  if (!lignes.length) return `<h2>Joueurs</h2><p>Pas encore de stats joueurs pour ce filtre (lues sur les tableaux de fin de manche des VOD).</p>`;
  const cl = agregerJoueurs(lignes);
  return `<h2>Top 3</h2><div class="grille">${cl.slice(0,3).map((x,i) => carteMvp(x, i+1)).join("")}</div>
    <h2>Classement des joueurs</h2>${tableau(["#","Joueur","Équipe","Pts","Manches","Moy.","K","D","A","K/D","MVP manche"],
      cl.map((x,i) => [i+1, esc(x.j) + (x.doute?' <span class="doute">⚠</span>':""), esc(x.eq), x.sc, x.n, Math.round(x.sc/x.n), x.k, x.d, x.a,
        (x.k/Math.max(x.d,1)).toFixed(2), x.mvp.length]), [0,3,4,5,6,7,8,9,10])}
    <p class="petit">MVP = plus grosse somme des scores ; égalité → ratio K/D puis kills. ⚠ = au moins une valeur lue avec doute.</p>`;
}
function vueSoirees() {
  const dates = [...new Set(D.matchs.filter(filtre).map(m => m.date))].sort().reverse();
  return `<h2>Soirées</h2>` + dates.map(dt => {
    const ms = D.matchs.filter(m => m.date === dt && filtre(m));
    const js = D.joueurs.filter(l => l.date === dt);
    const parMatch = {}; js.forEach(l => (parMatch[l.m] ??= []).push(l));
    const pk = D.picks.filter(p => p.date === dt);
    return `<h3>${dt.split("-").reverse().join("/")} · ${[...new Set(ms.map(m => "Div " + m.div))].join(", ")}</h3>` +
      tableau(["Match","Score","Cartes","Commence le pick & ban","MVP du match"], ms.map(m => {
        const cartes = D.manches.filter(s => s.m === m.id).map(s => `${nomCarte(s.carte)} ${s.s[0]}-${s.s[1]}`).join(" · ");
        const p = pk.find(p => [p.equipe_1, p.equipe_2].sort().join() === [...m.e].sort().join());
        const mvp = parMatch[m.id] ? agregerJoueurs(parMatch[m.id])[0] : null;
        return [`${esc(m.e[0])} – ${esc(m.e[1])}`, `<b>${m.s[0]}-${m.s[1]}</b>`, cartes, p ? esc(p.commence_pick_ban) : "—",
          mvp ? `${esc(mvp.j)} (${mvp.sc} pts, ${mvp.k}/${mvp.d}/${mvp.a})` : "—"];
      })) + (js.length ? `<div class="grille">${agregerJoueurs(js).slice(0,3).map((x,i) => carteMvp(x, i+1)).join("")}</div>` : "");
  }).join("");
}
function vuePicks() {
  const pk = D.picks.filter(p => (F.div === "toutes" || p.div === F.div) && (F.mois === "tous" || p.mois === F.mois));
  const res = {};
  pk.forEach(p => { const m = D.matchs.find(m => m.date === p.date && [...m.e].sort().join() === [p.equipe_1, p.equipe_2].sort().join());
    [p.equipe_1, p.equipe_2].forEach(e => { const x = res[e] ??= {n:0, commence:0, vComm:0, vSuit:0, nSuit:0};
      x.n++; const c = p.commence_pick_ban === e; if (c) x.commence++; else x.nSuit++;
      if (m && m.v === e) { if (c) x.vComm++; else x.vSuit++; } }); });
  return `<h2>Pick & ban</h2><p class="petit">Relevé sur l'écran « CHOIX DES MAPS » des VOD (l'équipe qui commence banne en premier, pick les manches 1 et 3).</p>
    ${tableau(["Équipe","Matchs relevés","Commence","Victoires en commençant","Victoires en second"], Object.entries(res).sort().map(([e,x]) =>
      [esc(e), x.n, x.commence, `${x.vComm}/${x.commence}`, `${x.vSuit}/${x.nSuit}`]), [1,2])}
    ${tableau(["Date","Div","Match","Commence","Source"], [...pk].reverse().map(p => [p.date, p.div, `${esc(p.equipe_1)} – ${esc(p.equipe_2)}`, esc(p.commence_pick_ban), `<span class="petit">${esc(p.source)}</span>`]))}`;
}
const ONGLETS = {equipes:["Équipes", vueEquipes], cartes:["Cartes", vueCartes], joueurs:["Joueurs & MVP", vueJoueurs],
  soirees:["Soirées", vueSoirees], picks:["Pick & ban", vuePicks]};
function rendre() {
  document.getElementById("nav").innerHTML = Object.entries(ONGLETS).map(([k,[t]]) =>
    `<button data-o="${k}" class="${k===onglet?"actif":""}">${t}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { onglet = b.dataset.o;
    try { localStorage.setItem("onglet", onglet); } catch(e) {} rendre(); });
  document.getElementById("main").innerHTML = barreFiltres() + ONGLETS[onglet][1]();
  brancherFiltres(); triable();
}
function demarrer() {
  F.saison = saisons()[0] || null;
  try { onglet = localStorage.getItem("onglet") || onglet; if (!ONGLETS[onglet]) onglet = "equipes"; } catch(e) {}
  document.getElementById("maj").textContent = "Mise à jour : " + D.maj + " · source competitive.eva.gg + VOD Twitch";
  rendre();
}
init();
</script></body></html>
