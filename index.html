<script>let t0 = "dark"; try { t0 = localStorage.getItem("theme") || "dark"; } catch(e) {} document.documentElement.dataset.theme = t0;</script>
<style>

:root[data-theme="dark"] { --bg:#141016; --surface:#1E1822; --surface-2:#2A2130; --zebre:#221B27;

@font-face { font-family:"Barlow Condensed"; src:url(polices/BarlowCondensed-Medium.ttf); font-weight:500; font-display:swap; }
@font-face { font-family:"Barlow Condensed"; src:url(polices/BarlowCondensed-SemiBold.ttf); font-weight:600; font-display:swap; }

.nw { white-space:nowrap; }
/* barre du haut */

.cadre { max-width:1320px; margin:0 auto; }

.matchs { display:grid; gap:10px; margin:6px 0 16px; }

.eqs > div { display:flex; justify-content:space-between; gap:10px; }
.eqs .g { font-weight:700; } .eqs .p { color:var(--encre-2); } .eqs b { font-variant-numeric:tabular-nums; }
.champ .et { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--encre-2); }

h3 { font-size:15px; font-weight:650; margin:16px 0 8px; color:var(--encre-2); text-transform:uppercase; letter-spacing:.04em; text-align:center; }
.bouton { background:var(--surface); color:var(--encre); border:1px solid var(--ligne); border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }

.sommaire { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px; }
.sommaire a { font-size:13px; padding:4px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--ligne); color:var(--encre-2); text-decoration:none; }

.filtres { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin:14px 0 4px; font-size:14px; color:var(--encre-2); }

/* tableaux */
.tab { margin:6px 0 6px; display:flex; justify-content:center; }
table { border-collapse:separate; border-spacing:0; font-size:14px; background:var(--surface); border-radius:12px; box-shadow:var(--ombre);
  border:1px solid var(--ligne); overflow:hidden; max-width:100%; }

.logo-eq { width:20px; height:20px; border-radius:5px; object-fit:contain; vertical-align:-5px; margin-right:6px; background:var(--surface-2); }
.eq-n { display:inline-flex; align-items:center; gap:6px; text-align:left; vertical-align:middle; }

.vs-tete .logo-eq { width:44px; height:44px; border-radius:8px; vertical-align:middle; margin-right:10px; }

.lien { color:inherit; text-decoration:none; border-bottom:1px dotted var(--accent); cursor:pointer; }

.petit { color:var(--encre-2); font-size:12.5px; }
.doute { color:#C77C00; }

.intro { max-width:820px; margin:8px auto 12px; color:var(--encre-2); font-size:14px; text-align:center; }
/* cartes, tuiles */
.grille { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:14px; }
.carte, .carte-mvp, .record { background:var(--surface); border:1px solid var(--ligne); border-radius:12px; padding:12px 16px; box-shadow:var(--ombre); }

.barre.rouge span { background:var(--rouge); }
.choix { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; margin:14px 0; font-weight:600; }

/* accès */

@media (max-width:1150px) { .duo.serre { grid-template-columns:1fr; } }

</style></head><body>
<div class="haut"><img src="logo.png" alt=""><div class="marque">Pictave League <span>· Stats</span></div>
  <div class="recherche"><input id="q" type="search" placeholder="Rechercher une équipe ou un joueur ( / )" autocomplete="off" aria-label="Rechercher" disabled>
    <div id="res" class="res" hidden></div></div>
  <button class="bouton-haut" id="theme" type="button" title="Changer de thème"><span id="theme-ic">◐</span> <span class="txt" id="theme-txt">Mode sombre</span></button></div>

// ---------- accès ----------
async function dechiffrer(mdp) {
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  for (const a of CHARGE.acces) {           // un accès par mot de passe (admin, salle…)
    const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(a.sel), iterations:200000, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    let brute; try { brute = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(a.iv)}, k, b(a.ck)); } catch(e) { continue; }
    const cle = await crypto.subtle.importKey("raw", brute, "AES-GCM", false, ["decrypt"]);
    const clair = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(CHARGE.iv)}, cle, b(CHARGE.ct));
    return JSON.parse(new TextDecoder().decode(clair));
  }
  throw new Error("mot de passe incorrect");
}
function verrou() {
  document.getElementById("main").innerHTML = `<div id="verrou"><img src="logo.png" alt=""><h2>Accès réservé</h2>
    <div class="mdp"><input type="password" id="mdp" placeholder="Mot de passe" autocomplete="current-password" autofocus>
    <button type="button" class="oeil" id="oeil" aria-pressed="false">Afficher</button></div>
    <button id="ok">Entrer</button><p class="petit" id="err"></p></div>`;
  const champ = document.getElementById("mdp"), oeil = document.getElementById("oeil");
  oeil.onclick = () => { const voir = champ.type === "password"; champ.type = voir ? "text" : "password";
    oeil.textContent = voir ? "Masquer" : "Afficher"; oeil.setAttribute("aria-pressed", String(voir)); champ.focus(); };
  const go = async () => {
    try { const mdp = champ.value; D = await dechiffrer(mdp);
          try { sessionStorage.setItem("mdp", mdp); } catch(e) {} demarrer(); }
    catch(e) { document.getElementById("err").textContent = "Mot de passe incorrect."; }
  };
  document.getElementById("ok").onclick = go;
  champ.onkeydown = e => { if (e.key === "Enter") go(); };
}
async function init() {
  if (!CHARGE.ct) { D = CHARGE; return demarrer(); }
  let m = null; try { m = sessionStorage.getItem("mdp"); } catch(e) {}
  if (m) { try { D = await dechiffrer(m); return demarrer(); } catch(e) {} }
  verrou();
}

function statsEquipes(ms, mn) {
  const eq = {}, g = n => eq[n] ??= {nom:n, mj:0, mv:0, manj:0, manv:0, pour:0, contre:0, forme:[], cartes:{}, divs:new Set()};
  [...ms].sort((a,b) => (a.t || a.date).localeCompare(b.t || b.date)).forEach(m => m.e.forEach(n => {
    const x = g(n); x.mj++; x.divs.add(m.div); const w = m.v === n; if (w) x.mv++; x.forme.push(w ? "V" : "D"); }));
  mn.forEach(s => s.e.forEach((n,i) => { const x = g(n); x.manj++; const w = s.s[i] > s.s[1-i]; if (w) x.manv++;
    x.pour += s.s[i]; x.contre += s.s[1-i]; const c = x.cartes[s.carte] ??= [0,0,0]; c[w ? 0 : 1]++; c[2] += s.s[i]; }));
  return eq;
}
const diffMan = x => 2*x.manv - x.manj;
const ordreEq = (a,b) => b.mv - a.mv || diffMan(b) - diffMan(a) || (b.pour - b.contre) - (a.pour - a.contre) || a.nom.localeCompare(b.nom);
const taux = v => v[0] / (v[0] + v[1]);
