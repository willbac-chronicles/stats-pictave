<script>let t0 = "dark"; try { t0 = localStorage.getItem("theme") || "dark"; } catch(e) {} document.documentElement.dataset.theme = t0;</script>
<style>

:root[data-theme="dark"] { --bg:#141016; --surface:#1E1822; --surface-2:#2A2130; --zebre:#221B27;

@font-face { font-family:"Barlow Condensed"; src:url(polices/BarlowCondensed-Medium.ttf); font-weight:500; font-display:swap; }
@font-face { font-family:"Barlow Condensed"; src:url(polices/BarlowCondensed-SemiBold.ttf); font-weight:600; font-display:swap; }

.nw { white-space:nowrap; }
/* barre du haut */

.cadre { max-width:1320px; margin:0 auto; }

.matchs { display:grid; gap:10px; margin:6px 0 16px; }

.eqs > div { display:flex; justify-content:space-between; gap:10px; }
.eqs .g { font-weight:700; } .eqs .p { color:var(--encre-2); } .eqs b { font-variant-numeric:tabular-nums; }
.champ .et { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--encre-2); }

h3 { font-size:15px; font-weight:650; margin:16px 0 8px; color:var(--encre-2); text-transform:uppercase; letter-spacing:.04em; text-align:center; }
.bouton { background:var(--surface); color:var(--encre); border:1px solid var(--ligne); border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }

.sommaire { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px; }
.sommaire a { font-size:13px; padding:4px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--ligne); color:var(--encre-2); text-decoration:none; }

.filtres { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin:14px 0 4px; font-size:14px; color:var(--encre-2); }

/* tableaux */
.tab { margin:6px 0 6px; display:flex; justify-content:center; }
table { border-collapse:separate; border-spacing:0; font-size:14px; background:var(--surface); border-radius:12px; box-shadow:var(--ombre);
  border:1px solid var(--ligne); overflow:hidden; max-width:100%; }

.logo-eq { width:20px; height:20px; border-radius:5px; object-fit:contain; vertical-align:-5px; margin-right:6px; background:var(--surface-2); }
.eq-n { display:inline-flex; align-items:center; gap:6px; text-align:left; vertical-align:middle; }

.vs-tete .logo-eq { width:44px; height:44px; border-radius:8px; vertical-align:middle; margin-right:10px; }

.lien { color:inherit; text-decoration:none; border-bottom:1px dotted var(--accent); cursor:pointer; }

.petit { color:var(--encre-2); font-size:12.5px; }
.doute { color:#C77C00; }

.intro { max-width:820px; margin:8px auto 12px; color:var(--encre-2); font-size:14px; text-align:center; }
/* cartes, tuiles */
.grille { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:14px; }
.carte, .carte-mvp, .record { background:var(--surface); border:1px solid var(--ligne); border-radius:12px; padding:12px 16px; box-shadow:var(--ombre); }

.barre.rouge span { background:var(--rouge); }
.choix { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; margin:14px 0; font-weight:600; }

/* accès */

@media (max-width:1150px) { .duo.serre { grid-template-columns:1fr; } }

</style></head><body>
<div class="haut"><img src="logo.png" alt=""><div class="marque">Pictave League <span>· Stats</span></div>
  <div class="recherche"><input id="q" type="search" placeholder="Rechercher une équipe ou un joueur ( / )" autocomplete="off" aria-label="Rechercher" disabled>
    <div id="res" class="res" hidden></div></div>
  <button class="bouton-haut" id="theme" type="button" title="Changer de thème"><span id="theme-ic">◐</span> <span class="txt" id="theme-txt">Mode sombre</span></button></div>

const CARTES = {atlantis:"Atlantis", ceres:"Cérès", engine:"Engine", outlaw:"Outlaw", polaris:"Polaris", reef_point:"Reef Point",
  silva:"Silva", the_cliff:"The Cliff", non_renseignee:"(non renseignée)"};
const nomCarte = c => CARTES[c] || (c||"?").replace(/_/g," ").replace(/\b\w/g, x => x.toUpperCase());
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = d => (d || "").split("-").reverse().join("/");
const ratio = x => (x.k / Math.max(x.d, 1)).toFixed(2);
const pct = (a,b) => b ? Math.round(100*a/b) + " %" : "—";
const pl = (n, mot) => `${n} ${mot}${n > 1 ? "s" : ""}`;
const memePaire = (a, b) => [...a].sort().join("|") === [...b].sort().join("|");
const logoEq = n => { const l = (D && D.logos || {})[n]; return l ? `<img class="logo-eq" src="${l.i}" alt=""${l.f ? ` style="background:${l.f}"` : ""}>` : ""; };
const lienEq = n => { const l = logoEq(n), a = `<a href="#equipe/${encodeURIComponent(n)}" class="lien" data-eq="${esc(n)}">${esc(n)}</a>`;
  return l ? `<span class="eq-n">${l}${a}</span>` : a; };
const lienJ = p => `<a href="#joueur/${encodeURIComponent(p)}" class="lien" data-j="${esc(p)}">${esc(p)}</a>`;
const vd = (v, d) => `<span class="v">${v}</span>-<span class="d">${d}</span>`;
const bilan = (v, d) => `<span class="${v > d ? "v" : v < d ? "d" : "nul"}">${v}-${d}</span>`;

async function dechiffrer(mdp) {
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  for (const a of CHARGE.acces) {           // un accès par mot de passe (admin, salle…)
    const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(a.sel), iterations:200000, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    let brute; try { brute = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(a.iv)}, k, b(a.ck)); } catch(e) { continue; }
    const cle = await crypto.subtle.importKey("raw", brute, "AES-GCM", false, ["decrypt"]);
    const clair = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(CHARGE.iv)}, cle, b(CHARGE.ct));
    return JSON.parse(new TextDecoder().decode(clair));
  }
  throw new Error("mot de passe incorrect");
}
function verrou() {
  document.getElementById("main").innerHTML = `<div id="verrou"><img src="logo.png" alt=""><h2>Accès réservé</h2>
    <div class="mdp"><input type="password" id="mdp" placeholder="Mot de passe" autocomplete="current-password" autofocus>
    <button type="button" class="oeil" id="oeil" aria-pressed="false">Afficher</button></div>
    <button id="ok">Entrer</button><p class="petit" id="err"></p></div>`;
  const champ = document.getElementById("mdp"), oeil = document.getElementById("oeil");
  oeil.onclick = () => { const voir = champ.type === "password"; champ.type = voir ? "text" : "password";
    oeil.textContent = voir ? "Masquer" : "Afficher"; oeil.setAttribute("aria-pressed", String(voir)); champ.focus(); };
  const go = async () => {
    try { const mdp = champ.value; D = await dechiffrer(mdp);
          try { sessionStorage.setItem("mdp", mdp); } catch(e) {} demarrer(); }
    catch(e) { document.getElementById("err").textContent = "Mot de passe incorrect."; }
  };
  document.getElementById("ok").onclick = go;
  champ.onkeydown = e => { if (e.key === "Enter") go(); };
}
async function init() {
  if (!CHARGE.ct) { D = CHARGE; return demarrer(); }
  let m = null; try { m = sessionStorage.getItem("mdp"); } catch(e) {}

function statsEquipes(ms, mn) {

  [...ms].sort((a,b) => (a.t || a.date).localeCompare(b.t || b.date)).forEach(m => m.e.forEach(n => {
    const x = g(n); x.mj++; x.divs.add(m.div); const w = m.v === n; if (w) x.mv++; x.forme.push(w ? "V" : "D"); }));
  mn.forEach(s => s.e.forEach((n,i) => { const x = g(n); x.manj++; const w = s.s[i] > s.s[1-i]; if (w) x.manv++;
    x.pour += s.s[i]; x.contre += s.s[1-i]; const c = x.cartes[s.carte] ??= [0,0,0]; c[w ? 0 : 1]++; c[2] += s.s[i]; }));

}

const ordreEq = (a,b) => b.mv - a.mv || diffMan(b) - diffMan(a) || (b.pour - b.contre) - (a.pour - a.contre) || a.nom.localeCompare(b.nom);

  return b ? `${nomCarte(b[0])} (${b[1][0]}-${b[1][1]})` : "—";
}

function agregerJoueurs(lignes) {

function detailPB(p) {

    bans = {}; const vus = new Set(picks.map(q => q.carte));

    if (onglet === "accueil" && p[1]) ACC = +p[1];
    if (onglet === "joueurs") JST = STATS_J[p[1]] ? p[1] : null; }
  return true;
}
function naviguer(maj) { maj(); rendre(true); window.scrollTo(0, 0); }
function rendre(pousser) {
  const nav = document.getElementById("nav");
  nav.innerHTML = GROUPES.map(([g, ks]) => ks.map(k =>
    `<button data-o="${k}" title="${g}" class="${k === onglet && !fiche ? "actif" : ""}">${ONGLETS[k][0]}</button>`).join("")).join(`<span class="sep"></span>`);
  document.getElementById("maj").textContent = `Mise à jour : ${D.maj} · Sources : competitive.eva.gg + VOD Twitch`;
  nav.querySelectorAll("button").forEach(b => b.onclick = () => naviguer(() => { onglet = b.dataset.o; fiche = null; JST = null; }));
  const act = nav.querySelector(".actif"); if (act) nav.scrollLeft = act.offsetLeft - nav.clientWidth / 2 + act.offsetWidth / 2;
  let titre, corps;
  if (fiche) { titre = (fiche.type === "eq" ? logoEq(fiche.nom) : "") + esc(fiche.nom); corps = fiche.type === "eq" ? ficheEquipe(fiche.nom) : ficheJoueur(fiche.nom); }
  else { titre = ONGLETS[onglet][0]; corps = (SANS_FILTRES.includes(onglet) ? "" : barreFiltres()) + ONGLETS[onglet][1](); }
  const main = document.getElementById("main");
  main.innerHTML = `<div class="titre-page"><h1>${titre}</h1><div>${fiche ? `<button class="bouton" data-retour>← Retour</button> ` : ""}<button class="bouton" id="copier">Copier le lien</button></div></div>
    <nav class="sommaire" id="sommaire"></nav>${corps}`;
  // sommaire automatique (raccourcis vers chaque section)
  const h2 = [...main.querySelectorAll("h2")];
  document.getElementById("sommaire").innerHTML = h2.length >= 3 ? h2.map((h, i) => { h.id = "s" + i; return `<a href="#" data-ancre="s${i}">${h.textContent}</a>`; }).join("") : "";
  brancher();
  const h = "#" + hashEtat();
  if (location.hash !== h) { if (pousser) history.pushState(null, "", h); else history.replaceState(null, "", h); }
  try { localStorage.setItem("onglet", onglet); } catch(e) {}
}
function brancher() {
  const $ = id => document.getElementById(id), ch = (id, f) => { const el = $(id); if (el) el.onchange = e => f(e.target.value); };
  ch("fs", v => { F.saison = v; F.mois = "tous"; rendre(); }); ch("fm", v => { F.mois = v; rendre(); }); ch("fd", v => { F.div = v; rendre(); });
  ch("fa", v => { FA.a = v; rendre(); }); ch("fb", v => { FA.b = v; rendre(); });
  ch("da", v => { DU.a = v; rendre(); }); ch("db", v => { DU.b = v; rendre(); });
  ch("ca", v => { CA.a = v; rendre(); }); ch("cb", v => { CA.b = v; rendre(); }); ch("cc", v => { CA.carte = v; rendre(); });
  ch("acc", v => { ACC = +v; rendre(); });
  ch("jst", v => { JST = v; rendre(true); });
  $("copier").onclick = async () => { const b = $("copier");
    try { await navigator.clipboard.writeText(location.href); b.textContent = "Lien copié ✓"; } catch(e) { b.textContent = "Copier depuis la barre d'adresse"; }
    setTimeout(() => { if (b.isConnected) b.textContent = "Copier le lien"; }, 2000); };
  triable();
}
function rechercheInit() {
  const q = document.getElementById("q"), res = document.getElementById("res");
  q.disabled = false;
  const items = () => {
    const eqs = [...new Set([...D.matchs.flatMap(m => m.e), ...Object.keys(D.lineups || {})])].map(e => ({t:"eq", nom:e, info:"équipe"}));
    const avecStats = new Set(D.joueurs.map(l => l.p));
    const js = [...avecStats].map(p => ({t:"j", nom:p, info:"joueur · " + (D.joueurs.find(l => l.p === p) || {}).eq}));
    const autres = Object.entries(D.lineups || {}).flatMap(([e, l]) => l.filter(p => !avecStats.has(p)).map(p => ({t:"eq", nom:e, label:p, info:"joueur de " + e + " (pas de stats)"})));
    return [...eqs, ...js, ...autres];
  };
  let sel = 0, liste = [];
  const montrer = () => { const t = sansAccent(q.value.trim());
    if (!t) { res.hidden = true; return; }
    liste = items().filter(i => sansAccent(i.label || i.nom).includes(t)).sort((a,b) => sansAccent(a.label || a.nom).indexOf(t) - sansAccent(b.label || b.nom).indexOf(t)).slice(0, 8);
    sel = 0; res.hidden = false;
    res.innerHTML = liste.length ? liste.map((i,k) => `<a href="#" data-k="${k}" class="${k === sel ? "sel" : ""}"><span>${esc(i.label || i.nom)}</span><span class="petit">${esc(i.info)}</span></a>`).join("")
      : `<div class="vide">Aucun résultat</div>`; };
  const ouvrir = i => { if (!i) return; q.value = ""; res.hidden = true; q.blur(); naviguer(() => { fiche = {type:i.t, nom:i.nom}; }); };
  q.oninput = montrer;
  q.onkeydown = e => { const a = res.querySelectorAll("a");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!a.length) return;
      sel = (sel + (e.key === "ArrowDown" ? 1 : a.length - 1)) % a.length; a.forEach((x,k) => x.classList.toggle("sel", k === sel)); }
    else if (e.key === "Enter") { e.preventDefault(); ouvrir(liste[sel]); }
    else if (e.key === "Escape") { res.hidden = true; q.blur(); } };
  res.onmousedown = e => { const a = e.target.closest("a[data-k]"); if (a) { e.preventDefault(); ouvrir(liste[+a.dataset.k]); } };
  q.onblur = () => setTimeout(() => res.hidden = true, 150);
  document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); } });
}
function demarrer() {
  F.saison = saisons()[0] || null;
  if (!lireHash()) { try { onglet = localStorage.getItem("onglet") || onglet; if (!ONGLETS[onglet]) onglet = "accueil"; } catch(e) {} }
  document.getElementById("main").addEventListener("click", e => {
    const anc = e.target.closest("[data-ancre]");
    if (anc) { e.preventDefault(); document.getElementById(anc.dataset.ancre).scrollIntoView({behavior:"smooth"}); return; }
    const st = e.target.closest("[data-st]");
    if (st) { e.preventDefault(); naviguer(() => { onglet = "joueurs"; fiche = null; JST = st.dataset.st || null; }); return; }
    const a = e.target.closest("[data-eq],[data-j],[data-retour]"); if (!a) return; e.preventDefault();
    if (a.hasAttribute("data-retour")) { history.back(); return; }
    naviguer(() => { fiche = a.hasAttribute("data-eq") ? {type:"eq", nom:a.dataset.eq} : {type:"j", nom:a.dataset.j}; });
  });
  window.addEventListener("popstate", () => { if (lireHash()) rendre(); });
  rechercheInit();
  ticker();
  rendre();
}
function ticker() {
  const el = document.getElementById("ticker");
  const ms = D.matchs.filter(dansSaison).sort((a,b) => (b.t || b.date).localeCompare(a.t || a.date)).slice(0, 8);
  if (!ms.length) return;
  const carte = m => `<a class="tk" href="#duels/${enc(m.e[0])}/${enc(m.e[1])}" data-du="${esc(m.e.join("|"))}"><span class="info">Div ${m.div} · ${fmtDate(m.date).slice(0, 5)}</span>
    ${m.e.map((e,i) => `<span class="${m.v === e ? "g" : "p"}">${logoEq(e)}${esc(e)}</span><b class="${m.v === e ? "g" : "p"}">${m.s[i]}</b>`).join("")}</a>`;
  const suite = ms.map(carte).join("");
  el.innerHTML = `<div class="piste">${suite}${suite.replace(/<a /g, '<a tabindex="-1" aria-hidden="true" ')}</div>`;
  el.hidden = false;
  el.onclick = e => { const a = e.target.closest("[data-du]"); if (!a) return; e.preventDefault();
    const [x, y] = a.dataset.du.split("|");
    naviguer(() => { onglet = "duels"; fiche = null; DU.a = x; DU.b = y; F.mois = "tous"; F.div = "toutes"; }); };
}
init();
